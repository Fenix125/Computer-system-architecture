services:
  facade-service:
    build:
      context: .
      dockerfile: services/facade_service/Dockerfile
    container_name: facade-service
    environment:
      FACADE_SERVICE_URL: http://0.0.0.0:8000
      FACADE_INSTANCE_NAME: facade-service
      LOGGING_SERVICE_URLS: http://logging-service-1:8001,http://logging-service-2:8001,http://logging-service-3:8001
      COUNTER_SERVICE_URL: http://counter-service:8002
      DOWNSTREAM_TIMEOUT_SECONDS: "5"
    depends_on:
      - logging-service-1
      - logging-service-2
      - logging-service-3
      - counter-service
    ports:
      - "9000:8000"

  logging-service-1:
    build:
      context: .
      dockerfile: services/logging_service/Dockerfile
    container_name: logging-service-1
    restart: unless-stopped
    environment:
      LOGGING_SERVICE_URL: http://0.0.0.0:8001
      LOGGING_INSTANCE_NAME: logging-service-1
      HAZELCAST_CLUSTER_NAME: bank-hazelcast
      HAZELCAST_CLUSTER_MEMBERS: hazelcast-node-1:5701
      HAZELCAST_CLUSTER_CONNECT_TIMEOUT_SECONDS: "5"
      HAZELCAST_TRANSACTIONS_MAP_NAME: logging-transactions
      HAZELCAST_USER_INDEX_MAP_NAME: logging-user-index
      HAZELCAST_SMART_ROUTING: "false"
    depends_on:
      - hazelcast-node-1
    ports:
      - "9001:8001"

  logging-service-2:
    build:
      context: .
      dockerfile: services/logging_service/Dockerfile
    container_name: logging-service-2
    restart: unless-stopped
    environment:
      LOGGING_SERVICE_URL: http://0.0.0.0:8001
      LOGGING_INSTANCE_NAME: logging-service-2
      HAZELCAST_CLUSTER_NAME: bank-hazelcast
      HAZELCAST_CLUSTER_MEMBERS: hazelcast-node-2:5701
      HAZELCAST_CLUSTER_CONNECT_TIMEOUT_SECONDS: "5"
      HAZELCAST_TRANSACTIONS_MAP_NAME: logging-transactions
      HAZELCAST_USER_INDEX_MAP_NAME: logging-user-index
      HAZELCAST_SMART_ROUTING: "false"
    depends_on:
      - hazelcast-node-2
    ports:
      - "9002:8001"

  logging-service-3:
    build:
      context: .
      dockerfile: services/logging_service/Dockerfile
    container_name: logging-service-3
    restart: unless-stopped
    environment:
      LOGGING_SERVICE_URL: http://0.0.0.0:8001
      LOGGING_INSTANCE_NAME: logging-service-3
      HAZELCAST_CLUSTER_NAME: bank-hazelcast
      HAZELCAST_CLUSTER_MEMBERS: hazelcast-node-3:5701
      HAZELCAST_CLUSTER_CONNECT_TIMEOUT_SECONDS: "5"
      HAZELCAST_TRANSACTIONS_MAP_NAME: logging-transactions
      HAZELCAST_USER_INDEX_MAP_NAME: logging-user-index
      HAZELCAST_SMART_ROUTING: "false"
    depends_on:
      - hazelcast-node-3
    ports:
      - "9003:8001"

  counter-service:
    build:
      context: .
      dockerfile: services/counter_service/Dockerfile
    container_name: counter-service
    environment:
      COUNTER_SERVICE_URL: http://0.0.0.0:8002
      COUNTER_INSTANCE_NAME: counter-service
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/banking
      POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9004:8002"

  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  hazelcast-node-1:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast-node-1
    hostname: hazelcast-node-1
    environment:
      HAZELCAST_CONFIG: hazelcast.yml
    volumes:
      - ./hazelcast.yml:/opt/hazelcast/hazelcast.yml:ro
    ports:
      - "5701:5701"

  hazelcast-node-2:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast-node-2
    hostname: hazelcast-node-2
    environment:
      HAZELCAST_CONFIG: hazelcast.yml
    volumes:
      - ./hazelcast.yml:/opt/hazelcast/hazelcast.yml:ro
    ports:
      - "5702:5701"

  hazelcast-node-3:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast-node-3
    hostname: hazelcast-node-3
    environment:
      HAZELCAST_CONFIG: hazelcast.yml
    volumes:
      - ./hazelcast.yml:/opt/hazelcast/hazelcast.yml:ro
    ports:
      - "5703:5701"

  hazelcast-mc:
    image: hazelcast/management-center:5.6.0
    container_name: hazelcast-mc
    hostname: hazelcast-mc
    environment:
      MC_DEFAULT_CLUSTER: bank-hazelcast
      MC_DEFAULT_CLUSTER_MEMBERS: hazelcast-node-1:5701,hazelcast-node-2:5701,hazelcast-node-3:5701
    depends_on:
      - hazelcast-node-1
      - hazelcast-node-2
      - hazelcast-node-3
    ports:
      - "8080:8080"

volumes:
  postgres-data:
