hazelcast:
  cluster-name: bank-hazelcast
  map:
    logging-transactions:
      backup-count: 1
      async-backup-count: 0
    logging-user-index:
      backup-count: 1
      async-backup-count: 0
  network:
    port:
      port: 5701
      auto-increment: false
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - hazelcast-node-1:5701
          - hazelcast-node-2:5701
          - hazelcast-node-3:5701
