hazelcast:
  cluster-name: test-hazelcast
  map:
    distributed-demo-map:
      backup-count: 1
      async-backup-count: 0
  queue:
    bounded-consumer-queue:
      max-size: 10
    bounded-full-queue:
      max-size: 10
  network:
    port:
      port: 5701
      auto-increment: false
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - hazelcast-node-1:5701
          - hazelcast-node-2:5701
          - hazelcast-node-3:5701
