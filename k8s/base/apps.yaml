apiVersion: v1
kind: Service
metadata:
  name: facade-service
  labels:
    app.kubernetes.io/name: facade-service
    app.kubernetes.io/part-of: banking-lab5
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: facade-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
  labels:
    app.kubernetes.io/name: facade-service
    app.kubernetes.io/part-of: banking-lab5
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: facade-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: facade-service
        app.kubernetes.io/part-of: banking-lab5
    spec:
      serviceAccountName: banking-app
      containers:
        - name: facade-service
          image: computer-system-architecture-facade:lab5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: banking-app-config
          env:
            - name: FACADE_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
