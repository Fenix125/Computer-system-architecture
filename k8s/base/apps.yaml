apiVersion: v1
kind: Service
metadata:
  name: counter-service
  labels:
    app.kubernetes.io/name: counter-service
    app.kubernetes.io/part-of: banking-lab5
spec:
  ports:
    - name: http
      port: 8002
      targetPort: http
  selector:
    app.kubernetes.io/name: counter-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-service
  labels:
    app.kubernetes.io/name: counter-service
    app.kubernetes.io/part-of: banking-lab5
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: counter-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counter-service
        app.kubernetes.io/part-of: banking-lab5
    spec:
      serviceAccountName: banking-app
      containers:
        - name: counter-service
          image: computer-system-architecture-counter:lab5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: banking-app-config
          env:
            - name: COUNTER_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
