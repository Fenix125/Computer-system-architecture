apiVersion: v1
kind: ConfigMap
metadata:
  name: hazelcast-config
  labels:
    app.kubernetes.io/name: hazelcast
    app.kubernetes.io/part-of: banking-lab5
data:
  hazelcast.yml: |
    hazelcast:
      cluster-name: bank-hazelcast
      map:
        logging-transactions:
          backup-count: 1
          async-backup-count: 0
        logging-user-index:
          backup-count: 1
          async-backup-count: 0
      network:
        port:
          port: 5701
          auto-increment: false
        join:
          multicast:
            enabled: false
          tcp-ip:
            enabled: true
            member-list:
              - hazelcast-0.hazelcast-headless:5701
              - hazelcast-1.hazelcast-headless:5701
              - hazelcast-2.hazelcast-headless:5701
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast
  labels:
    app.kubernetes.io/name: hazelcast
    app.kubernetes.io/part-of: banking-lab5
spec:
  ports:
    - name: hazelcast
      port: 5701
      targetPort: hazelcast
  selector:
    app.kubernetes.io/name: hazelcast
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-headless
  labels:
    app.kubernetes.io/name: hazelcast
    app.kubernetes.io/part-of: banking-lab5
spec:
  clusterIP: None
  ports:
    - name: hazelcast
      port: 5701
      targetPort: hazelcast
  selector:
    app.kubernetes.io/name: hazelcast
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hazelcast
  labels:
    app.kubernetes.io/name: hazelcast
    app.kubernetes.io/part-of: banking-lab5
spec:
  serviceName: hazelcast-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hazelcast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hazelcast
        app.kubernetes.io/part-of: banking-lab5
    spec:
      containers:
        - name: hazelcast
          image: hazelcast/hazelcast:5.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: hazelcast
              containerPort: 5701
          env:
            - name: HAZELCAST_CONFIG
              value: /opt/hazelcast/hazelcast.yml
          readinessProbe:
            tcpSocket:
              port: hazelcast
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: hazelcast
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: hazelcast-config
              mountPath: /opt/hazelcast/hazelcast.yml
              subPath: hazelcast.yml
      volumes:
        - name: hazelcast-config
          configMap:
            name: hazelcast-config
