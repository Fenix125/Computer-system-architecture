apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-app
  labels:
    app.kubernetes.io/part-of: banking-lab5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-pod-discovery
  labels:
    app.kubernetes.io/part-of: banking-lab5
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-pod-discovery
  labels:
    app.kubernetes.io/part-of: banking-lab5
subjects:
  - kind: ServiceAccount
    name: banking-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-pod-discovery
